name: Deploy para Azure VM

on:
  push:
    branches:
      - Master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.20.38.41.185 }}
        username: ${{ secrets.raimundo }}
        key: ${{ secrets.ssh-rsa  raimundo@SandboxHost-638856895897397185
 }}
        port: 22
        script: |
          cd /caminho/do/seu/app
          git pull origin Master
          # outros comandos que quiser executar na VM
